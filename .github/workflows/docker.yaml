name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.15.1

jobs:
  push:
    name: Push
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip docker') && !contains(github.event.head_commit.message, 'docker skip')"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theis-js/pterodactyl-panel
          flavor: |
            latest=false
          tags: |
            type=raw,value=v1.15.1-php8.3.36

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PHP 8.3.36 base image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/docker-library/php.git#e3eaff845f7a9f7259c31da54dce0320b47a3bbd:8.3/alpine3.24/fpm
          platforms: linux/amd64
          push: true
          tags: ghcr.io/theis-js/php:8.3.36-fpm-alpine
          cache-from: type=gha,scope=php-base
          cache-to: type=gha,mode=max,scope=php-base

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          labels: ${{ steps.docker_meta.outputs.labels }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
